# Docsworth CI for a knowledge repo. Copy to .github/workflows/knowledge.yml
# (`docsworth init --ci` does this).
#  - Pull requests, and pushes to the default branch: lint frontmatter, ownership and links.
# It runs the published CLI through npx, which has no Docsworth pro, so it runs no pro
# command: compiling runbooks into skills (`docsworth compile`) is pro's.
name: knowledge

on:
  pull_request:
    paths: ["knowledge/**", "CODEOWNERS", ".github/CODEOWNERS", "docs/CODEOWNERS", ".knowledge/config.yaml"]
  push:
    branches: [main]
    paths: ["knowledge/**", "CODEOWNERS", ".github/CODEOWNERS", "docs/CODEOWNERS", ".knowledge/config.yaml"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npx -y "__DOCSWORTH_PACKAGE__" lint .
