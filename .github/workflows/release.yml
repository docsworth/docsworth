# Publishes a release when a version tag is pushed (docs/releasing.md). Nothing happens
# until a maintainer tags: scripts/release-guard.ts refuses any tag whose versions
# disagree, that names a package other than @docsworth/cli, that's a prerelease, or that
# has no release notes.
#
# Two jobs. `verify` has read access only: before installing anything it refuses a tag
# that isn't on main or can't be ours, then it installs, tests, packs exactly one
# tarball, checks that tarball's own manifest, and installs it as a customer would.
# `publish` holds the release rights and the npm token, runs no install or project
# code, and publishes that exact tarball. Both of its steps can run again: a tarball
# already on npm is checked, not published twice, and an existing release is updated.
#
# A tag runs the workflow file of the commit it points at, so a check in this file can't
# stop a tag on a branch whose workflow was edited. What can, and the owner sets up
# before the first release:
#   - the npm package's org, and a publish-only token for the package, stored as the
#     NPM_TOKEN secret of the `release` environment (Settings → Environments)
#   - required reviewers on that environment, so a person approves every publish
#   - a tag ruleset, so only the owner can create `v*` tags
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      integrity: ${{ steps.pack.outputs.integrity }}
    steps:
      # Actions are pinned by commit SHA; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # to tell whether the tag is on main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.12"
          cache: npm
      # Node alone, before `npm ci` runs anything of the tag's: the full guard needs the
      # dependencies, and runs again after them.
      - name: Before installing anything, refuse a tag that isn't on main or can't be ours
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME isn't on main"; exit 1; }
          node -e '
            const fs = require("fs");
            const tag = process.env.GITHUB_REF_NAME;
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const fail = (why) => { console.error(why); process.exit(1); };
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) fail(`${tag} isn'"'"'t a release tag`);
            if (tag !== `v${p.version}`) fail(`the tag ${tag} isn'"'"'t v${p.version}, the version in package.json`);
            if (p.name !== "@docsworth/cli") fail(`package.json names ${p.name}, not @docsworth/cli, the package we publish`);
            if (!fs.existsSync(`docs/release-notes/${tag}.md`)) fail(`there are no release notes for ${tag}`);'
      - run: npm ci
      - name: Refuse unless this tag can be published as ours
        run: npx tsx scripts/release-guard.ts "$GITHUB_REF_NAME"
      - run: npm test
        env:
          DOCSWORTH_NO_GH_CLI: "1"
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build, pack exactly one tarball, check it, SBOM
        id: pack
        run: |
          npm run build
          rm -f ./*.tgz
          tarball=$(npm pack --json | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename)')
          count=$(ls ./*.tgz | wc -l)
          [ "$count" -eq 1 ] || { echo "expected one tarball, found $count"; exit 1; }
          files=$(tar -tzf "$tarball")
          grep -Fqx 'package/dist/cli.js' <<<"$files" || { echo "dist/cli.js is missing from the tarball"; exit 1; }
          if grep -E '^package/(dist/pro/|packages/)|LICENSE-PRO|LICENSE\.md$' <<<"$files"; then echo "pro is in the CLI's tarball (listed above)"; exit 1; fi
          npx tsx scripts/release-guard.ts "$GITHUB_REF_NAME" --tarball "$tarball"
          # The CLI's own SBOM: without --workspaces=false npm lists pro's dependencies too.
          npm sbom --sbom-format cyclonedx --omit dev --workspaces=false > sbom.cdx.json
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "integrity=sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)" >> "$GITHUB_OUTPUT"
      # Uploaded as checked, before the clean install runs any install script; and the
      # checked bytes' integrity is this job's output, which a later step can't change.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            ${{ steps.pack.outputs.tarball }}
            sbom.cdx.json
          if-no-files-found: error
          retention-days: 7
      - name: Clean install from the tarball
        run: npx tsx scripts/smoke-install.ts "$TARBALL"
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # the GitHub release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.12"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release
      - name: The artifact is the one tarball verify checked
        env:
          TARBALL: ${{ needs.verify.outputs.tarball }}
          INTEGRITY: ${{ needs.verify.outputs.integrity }}
        run: |
          count=$(ls ./*.tgz | wc -l)
          [ "$count" -eq 1 ] && [ -f "$TARBALL" ] || { echo "expected only $TARBALL, found $count tarball(s)"; exit 1; }
          [ "sha512-$(openssl dgst -sha512 -binary "$TARBALL" | base64 -w0)" = "$INTEGRITY" ] || { echo "$TARBALL isn't the bytes verify checked"; exit 1; }
          tar -xOzf "$TARBALL" package/package.json | node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync(0, "utf8"));
            const repo = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const fail = (why) => { console.error(why); process.exit(1); };
            if (m.name !== "@docsworth/cli") fail(`the tarball names ${m.name}, not @docsworth/cli`);
            if (m.name !== repo.name) fail(`the tarball names ${m.name}, the tag'"'"'s package.json ${repo.name}`);
            if (`v${m.version}` !== process.env.GITHUB_REF_NAME) fail(`the tarball is ${m.version}, the tag ${process.env.GITHUB_REF_NAME}`);
            // publishConfig would override where and as what npm publishes it.
            const extra = Object.keys(m.publishConfig ?? {}).filter((k) => !["access", "provenance"].includes(k));
            if (extra.length) fail(`the tarball'"'"'s publishConfig sets ${extra.join(", ")}`);'
      # --ignore-scripts: no lifecycle script runs beside the token. On a re-run (the
      # GitHub release failed after npm took the tarball), a version already on npm is
      # left alone if it's this very tarball, and refused if it's another.
      # npm reads a project's .npmrc, which could send the token elsewhere: the tag's
      # commit may have none, and npm runs outside the checkout, with only setup-node's
      # user config (the registry and the token).
      - name: Publish the tested tarball to npm, with provenance, unless it's there already
        run: |
          [ ! -e .npmrc ] || { echo "the tag's commit has a .npmrc: refused, so no config of its reaches the token"; exit 1; }
          tarball="$PWD/$TARBALL"
          cd "$RUNNER_TEMP"
          spec=$(tar -xOzf "$tarball" package/package.json | node -e 'const m = JSON.parse(require("fs").readFileSync(0, "utf8")); process.stdout.write(`${m.name}@${m.version}`)')
          ours="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
          theirs=$(npm view "$spec" dist.integrity --registry https://registry.npmjs.org/ 2>/dev/null || true)
          if [ -z "$theirs" ]; then
            npm publish "$tarball" --ignore-scripts --provenance --access public --registry https://registry.npmjs.org/ --tag latest
          elif [ "$theirs" = "$ours" ]; then
            echo "$spec is on npm already, from this tarball"
          else
            echo "$spec is on npm already, from a different tarball"; exit 1
          fi
        env:
          TARBALL: ${{ needs.verify.outputs.tarball }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release with the tarball and SBOM, or its assets updated on a re-run
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$TARBALL" sbom.cdx.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$TARBALL" sbom.cdx.json --verify-tag --notes-file "docs/release-notes/$GITHUB_REF_NAME.md"
          fi
        env:
          TARBALL: ${{ needs.verify.outputs.tarball }}
          GH_TOKEN: ${{ github.token }}
