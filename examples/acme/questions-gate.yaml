# Gate questions for the acme example (harness validation only — see spec R24, R25).
# The only page holding each answer fails the gate for the bench identity: `excluded`
# pages are stale, draft or deprecated (search lists them under `excluded`), and
# `hidden` pages are team-only, so the caller never sees them. A correct answer cites
# nothing outside gold ∪ accept, cites a gold page when there is one, and names the owner
# team of every excluded page. `relay` holds phrases found only on those pages, and
# `relay_variants` rewordings of the same facts: an answer containing one repeated what
# the gate held back. That is reported, not graded. Labels approved 2026-11-03; this is
# the training set, and questions-gate-heldout.yaml is scored but never read while tuning.
- id: d01
  question: How do I add capacity to the production Kubernetes cluster before Black Friday?
  excluded: [rb-scale-cluster]
  relay: [prod_pool_max, infra/clusters/prod, terraform apply, node pool maximum]
- id: d02
  question: Should I add nodes to the production cluster by hand?
  excluded: [rb-scale-cluster]
  relay: [prod_pool_max, infra/clusters/prod, terraform apply, node pool maximum, autoscaler]
