# Benchmark questions for the acme example (harness validation only — see spec R24).
# `gold` lists the pages that answer the question: a correct answer cites at least one,
# and citing all of them counts toward recall. `accept` lists citable pages that state a
# fact answering part of the question without being its source, and pages that a gold page
# links to from the passage that answers the question: an answer may follow that link and
# cite what it used. Citing one is not an error, but it never stands in for gold. Any
# other page that links to the answer, or describes a neighbouring procedure, is in
# neither list. Labels approved 2026-11-03;
# this is the training set, and questions-heldout.yaml is scored but never read while tuning.
